<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menü | Tarihi Foça Simit Fırını</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu.css">

    <!-- CLOUDFLARE İNADINI KIRAN VE FİYATLARI DÜZELTEN KESİN ÇÖZÜM KODU -->
    <style>
        .menu-item-card {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            gap: 15px !important;
            flex-wrap: nowrap !important;
            overflow: hidden !important;
        }
        .item-info {
            flex: 1 1 0% !important; 
            min-width: 0 !important; 
            padding-right: 15px !important;
        }
        .item-info h3 {
            display: -webkit-box !important;
            -webkit-line-clamp: 1 !important; 
            -webkit-box-orient: vertical !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            white-space: normal !important;
            margin-bottom: 4px !important;
        }
        .item-info p {
            display: -webkit-box !important;
            -webkit-line-clamp: 1 !important; 
            -webkit-box-orient: vertical !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            white-space: normal !important; 
            margin: 0 !important;
        }
        .item-price {
            flex-shrink: 0 !important;
            white-space: nowrap !important;
            min-width: max-content !important;
            text-align: right !important;
        }
    </style>
</head>
<body class="menu-page-body">

    <div id="header-placeholder"></div>

    <main class="menu-main">
        
        <!-- ========================================== -->
        <!-- GÖRÜNÜM 1: ŞIK DİKEY KATEGORİ LİSTESİ      -->
        <!-- ========================================== -->
        <div id="view-categories">
            <div class="menu-banner">
                <div class="banner-overlay"></div>
                <div class="banner-content">
                    <h1 id="branch-title" class="gold-text">Şube Yükleniyor...</h1>
                    <p data-i18n="selectProduct">Lütfen incelemek istediğiniz kategoriye tıklayın.</p>
                </div>
            </div>
            
            <div class="vertical-categories-wrapper" id="vertical-categories">
                <!-- JS ile şık büyük butonlar buraya gelecek -->
            </div>
        </div>

        <!-- ========================================== -->
        <!-- GÖRÜNÜM 2: KULLANIŞLI YATAY MENÜ VE ÜRÜNLER-->
        <!-- ========================================== -->
        <div id="view-products" class="hidden">
            <div class="sticky-category-bar">
                <div class="sticky-header-top">
                    <button class="back-to-cats-btn" onclick="showCategoryView()">
                        <span class="icon">❮</span> <span data-i18n="backBtn">Kategoriler</span>
                    </button>
                </div>
                <div class="category-scroll-wrapper" id="horizontal-tabs">
                    <!-- JS ile yatay kaydırmalı butonlar buraya gelecek -->
                </div>
            </div>
            
            <div class="menu-grid" id="product-list">
                <!-- JS ile ürün kartları buraya gelecek -->
            </div>
            
            <!-- PREMIUM GÜVEN ROZETLERİ -->
            <div class="premium-badges">
                <div class="badge-item">
                    <span class="badge-icon">☕</span>
                    <span class="badge-text" data-i18n="badge1">Özenle<br>Seçilmiş Ürünler</span>
                </div>
                <div class="badge-item">
                    <span class="badge-icon">🌿</span>
                    <span class="badge-text" data-i18n="badge2">Doğal<br>İçerikler</span>
                </div>
                <div class="badge-item">
                    <span class="badge-icon">❄️</span>
                    <span class="badge-text" data-i18n="badge3">Daima Soğuk<br>Her Zaman Taze</span>
                </div>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <!-- ========================================== -->
    <!-- ÜRÜN DETAY PENCERESİ (AYDINLIK & KURŞUN GEÇİRMEZ) -->
    <!-- ========================================== -->
    <style>
        #product-detail-modal {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            background-color: rgba(0, 0, 0, 0.6) !important; /* Arka planı hafiflettim */
            z-index: 9999999 !important;
            display: none; 
            align-items: center !important;
            justify-content: center !important;
            backdrop-filter: blur(5px) !important;
            margin: 0 !important; padding: 0 !important;
        }
        .product-modal-content {
            background: var(--white-bg) !important; /* Beyaz modal arka planı */
            width: 90% !important; max-width: 400px !important;
            border-radius: 16px !important;
            border: 1px solid var(--border-color) !important;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15) !important;
            position: relative !important;
            overflow: hidden !important;
            animation: popIn 0.3s ease-out forwards !important;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .close-modal-btn {
            position: absolute !important; top: 12px !important; right: 12px !important;
            width: 32px !important; height: 32px !important;
            background: var(--light-bg) !important; color: var(--text-dark) !important;
            border: 1px solid var(--border-color) !important; border-radius: 50% !important;
            font-size: 1rem !important; cursor: pointer !important; z-index: 100 !important;
            display: flex !important; align-items: center !important; justify-content: center !important;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1) !important;
        }
        .close-modal-btn:hover { background: var(--gold) !important; color: #fff !important; border-color: var(--gold) !important; }
        .product-modal-image { width: 100% !important; height: 240px !important; background: var(--light-bg) !important; }
        .product-modal-image img { width: 100% !important; height: 100% !important; object-fit: cover !important; object-position: center !important; }
        .product-modal-details { padding: 25px 20px !important; text-align: center !important; }
        
        .product-modal-details h2 { color: var(--text-dark) !important; font-size: 1.6rem !important; margin: 0 0 10px 0 !important; font-family: 'Playfair Display', serif !important; font-weight: 800 !important; }
        .product-modal-details .modal-price { color: var(--gold) !important; font-size: 1.4rem !important; font-weight: 700 !important; margin: 0 0 15px 0 !important; }
        .product-modal-details .modal-divider { width: 50px !important; height: 3px !important; background: var(--gold) !important; margin: 0 auto 15px !important; opacity: 1 !important; border-radius: 2px !important;}
        .product-modal-details p { color: var(--text-muted) !important; font-weight: 500 !important; font-size: 0.95rem !important; line-height: 1.6 !important; margin: 0 !important; }
    </style>

    <div id="product-detail-modal" onclick="closeProductModal(event)">
        <div class="product-modal-content" onclick="event.stopPropagation()">
            <button class="close-modal-btn" onclick="closeProductModal()">✕</button>
            <div class="product-modal-image" id="modal-img-container">
                <img id="modal-img" src="" alt="Ürün Görseli">
            </div>
            <div class="product-modal-details">
                <h2 id="modal-title">Ürün Adı</h2>
                <div id="modal-price" class="modal-price">0 ₺</div>
                <div class="modal-divider"></div>
                <p id="modal-desc">Ürün açıklaması buraya gelecek.</p>
            </div>
        </div>
    </div>

    <!-- Supabase JS Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script src="menu.js"></script>
</body>
</html>
