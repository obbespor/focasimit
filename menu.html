<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menü | Tarihi Foça Simit Fırını</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu.css">

    <!-- CLOUDFLARE İNADINI KIRAN VE FİYATLARI DÜZELTEN KESİN ÇÖZÜM KODU -->
    <style>
        .menu-item-card {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            gap: 15px !important;
            flex-wrap: nowrap !important;
            overflow: hidden !important;
        }
        .item-info {
            flex: 1 1 0% !important; 
            min-width: 0 !important; 
            padding-right: 15px !important;
        }
        .item-info h3 {
            display: -webkit-box !important;
            -webkit-line-clamp: 1 !important; 
            -webkit-box-orient: vertical !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            white-space: normal !important;
            margin-bottom: 4px !important;
        }
        .item-info p {
            display: -webkit-box !important;
            -webkit-line-clamp: 1 !important; 
            -webkit-box-orient: vertical !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            white-space: normal !important; 
            margin: 0 !important;
        }
        /* HEADER VE KATEGORİ ÇAKIŞMASINI ÖNLEYEN AYARLAR */
        .menu-page-body {
            padding-top: 110px !important; /* Sayfa ilk açıldığında menüyü aşağı iter */
        }
        .sticky-category-bar {
            top: 85px !important; /* Sayfayı aşağı kaydırırken kategorilerin tam header'ın altında durmasını sağlar */
        }
        .item-price {
            flex-shrink: 0 !important;
            white-space: nowrap !important;
            min-width: max-content !important;
            text-align: right !important;
        }
    </style>
</head>
<body class="menu-page-body">

    <div id="header-placeholder"></div>

    <main class="menu-main">
        
        <!-- ========================================== -->
        <!-- GÖRÜNÜM 1: ŞIK DİKEY KATEGORİ LİSTESİ      -->
        <!-- ========================================== -->
        <div id="view-categories">
            <div class="menu-banner">
                <div class="banner-overlay"></div>
                <div class="banner-content">
                    <h1 id="branch-title" class="gold-text">Şube Yükleniyor...</h1>
                    <p data-i18n="selectProduct">Lütfen incelemek istediğiniz kategoriye tıklayın.</p>
                </div>
            </div>
            
            <div class="vertical-categories-wrapper" id="vertical-categories">
                <!-- JS ile şık büyük butonlar buraya gelecek -->
            </div>
        </div>

        <!-- ========================================== -->
        <!-- GÖRÜNÜM 2: KULLANIŞLI YATAY MENÜ VE ÜRÜNLER-->
        <!-- ========================================== -->
        <div id="view-products" class="hidden">
            <div class="sticky-category-bar">
                <div class="sticky-header-top">
                    <button class="back-to-cats-btn" onclick="showCategoryView()">
                        <span class="icon">❮</span> <span data-i18n="backBtn">Kategoriler</span>
                    </button>
                </div>
                <div class="category-scroll-wrapper" id="horizontal-tabs">
                    <!-- JS ile yatay kaydırmalı butonlar buraya gelecek -->
                </div>
            </div>
            
            <div class="menu-grid" id="product-list">
                <!-- JS ile ürün kartları buraya gelecek -->
            </div>
            
            <!-- PREMIUM GÜVEN ROZETLERİ -->
            <div class="premium-badges">
                <div class="badge-item">
                    <span class="badge-icon">☕</span>
                    <span class="badge-text" data-i18n="badge1">Özenle<br>Seçilmiş Ürünler</span>
                </div>
                <div class="badge-item">
                    <span class="badge-icon">🌿</span>
                    <span class="badge-text" data-i18n="badge2">Doğal<br>İçerikler</span>
                </div>
                <div class="badge-item">
                    <span class="badge-icon">❄️</span>
                    <span class="badge-text" data-i18n="badge3">Daima Soğuk<br>Her Zaman Taze</span>
                </div>
            </div>
        </div>

    </main>

    <div id="footer-placeholder"></div>

    <!-- ========================================== -->
    <!-- ÜRÜN DETAY PENCERESİ (AYDINLIK & KURŞUN GEÇİRMEZ) -->
    <!-- ========================================== -->
<!-- CLOUDFLARE İNADINI KIRAN VE FİYATLARI DÜZELTEN KESİN ÇÖZÜM KODU -->
    <style>
        .menu-item-card {
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            gap: 10px !important; /* 15px'ten 10px'e düşürdük */
            padding: 10px 12px !important; /* Kutu içi genel boşluğu daralttık */
            flex-wrap: nowrap !important;
            overflow: hidden !important;
        }
        
        /* Görseli biraz küçülterek yazı alanına ekstra yer açtık */
        .item-image {
            width: 70px !important; 
            height: 70px !important;
            flex-shrink: 0 !important;
        }
        
        .item-info {
            flex: 1 1 0% !important; 
            min-width: 0 !important; 
            padding-right: 5px !important; /* Fiyatla arasındaki payı daralttık */
        }
        
        /* ÜRÜN ADI: Tek satır kalacak, gerekirse fontu ufakça küçülecek */
        .item-info h3 {
            display: block !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            font-size: clamp(0.9rem, 4vw, 1.05rem) !important; /* Ekrana göre esnek font */
            letter-spacing: -0.2px !important; /* Harf aralığını belli belirsiz kıstık */
            margin-bottom: 3px !important;
        }
        
        /* AÇIKLAMALAR SADECE 1 SATIR GÖZÜKÜP (...) İLE KESİLECEK */
        .item-info p {
            display: block !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            font-size: 0.8rem !important;
            margin: 0 !important;
        }
        
        /* FİYAT BÖLÜMÜ: O da duruma göre esneyebilecek */
        .item-price {
            flex-shrink: 0 !important;
            white-space: nowrap !important;
            min-width: max-content !important;
            text-align: right !important;
            font-size: clamp(0.95rem, 4.5vw, 1.15rem) !important; /* Uzun metinlerde ezilmez, küçülür */
        }
    </style>
    <div id="product-detail-modal" onclick="closeProductModal(event)">
        <div class="product-modal-content" onclick="event.stopPropagation()">
            <button class="close-modal-btn" onclick="closeProductModal()">✕</button>
            <div class="product-modal-image" id="modal-img-container">
                <img id="modal-img" src="" alt="Ürün Görseli">
            </div>
            <div class="product-modal-details">
                <h2 id="modal-title">Ürün Adı</h2>
                <div id="modal-price" class="modal-price">0 ₺</div>
                <div class="modal-divider"></div>
                <p id="modal-desc">Ürün açıklaması buraya gelecek.</p>
            </div>
        </div>
    </div>

    <!-- Supabase JS Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script src="menu.js"></script>
</body>
</html>
